<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug CSS and JavaScript Application</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 10px rgba(0,0,0,0.2);
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#16395c;
}

#output{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
    color:#1f4e79;
}
</style>

</head>

<body>

<div class="container">

<h2>Square Calculator</h2>

<input type="number" id="number" placeholder="Enter a Number">

<button onclick="calculate()">Calculate Square</button>

<div id="output"></div>

</div>

<script>

function calculate(){

try{

let num=document.getElementById("number").value;

console.log("Input :",num);

debugger;

if(num==""){
throw "Please enter a number";
}

let result=num*num;

document.getElementById("output").innerHTML=
"Square = "+result;

console.log("Result :",result);

}

catch(error){

document.getElementById("output").innerHTML=error;

console.log(error);

}

}

</script>

</body>
</html>
