<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#1f4e79;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    margin-top:20px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#16395c;
}

.error{
    color:red;
    font-size:14px;
    margin-top:10px;
}

.success{
    color:green;
    font-size:16px;
    text-align:center;
    margin-top:15px;
}
</style>

</head>

<body>

<div class="container">

<h2>Student Registration Form</h2>

<form id="studentForm">

<label>Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="text" id="email">

<label>Phone Number</label>
<input type="text" id="phone">

<label>Age</label>
<input type="number" id="age">

<label>Department</label>
<select id="department">
<option value="">Select Department</option>
<option>Information Technology</option>
<option>Computer Science</option>
<option>Electronics</option>
<option>Mechanical</option>
</select>

<label>Password</label>
<input type="password" id="password">

<button type="submit">Register</button>

<p id="message"></p>

</form>

</div>

<script>

document.getElementById("studentForm").addEventListener("submit",function(event){

event.preventDefault();

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let phone=document.getElementById("phone").value.trim();
let age=document.getElementById("age").value.trim();
let department=document.getElementById("department").value;
let password=document.getElementById("password").value;
let message=document.getElementById("message");

let namePattern=/^[A-Za-z ]+$/;
let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let phonePattern=/^[0-9]{10}$/;
let passwordPattern=/^(?=.*[A-Za-z])(?=.*\d).{6,}$/;

if(!namePattern.test(name)){
    message.innerHTML="Enter a valid name.";
    message.className="error";
    return;
}

if(!emailPattern.test(email)){
    message.innerHTML="Enter a valid email.";
    message.className="error";
    return;
}

if(!phonePattern.test(phone)){
    message.innerHTML="Phone number must contain 10 digits.";
    message.className="error";
    return;
}

if(age<17 || age>30){
    message.innerHTML="Age must be between 17 and 30.";
    message.className="error";
    return;
}

if(department==""){
    message.innerHTML="Select a department.";
    message.className="error";
    return;
}

if(!passwordPattern.test(password)){
    message.innerHTML="Password must be at least 6 characters and contain letters and numbers.";
    message.className="error";
    return;
}

message.innerHTML="Student Registration Successful!";
message.className="success";

});

</script>

</body>
</html>
