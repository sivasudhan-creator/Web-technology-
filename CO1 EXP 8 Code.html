<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images, Hyperlinks and Iframes</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f4f4f4;
            margin:30px;
            text-align:center;
        }

        h1{
            color:#003366;
        }

        .container{
            width:80%;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        img{
            border:2px solid black;
            border-radius:10px;
            margin:15px;
        }

        a{
            text-decoration:none;
            color:blue;
            font-size:20px;
            font-weight:bold;
        }

        a:hover{
            color:red;
        }

        iframe{
            border:2px solid gray;
            margin-top:20px;
        }
    </style>
</head>

<body>

<div class="container">

<h1>Webpage Using Images, Hyperlinks and Iframes</h1>

<hr>

<h2>1. Image Example</h2>

<img src="nature.png"
     alt="Beautiful Nature"
     width="400"
     height="250">

<p>
The above image is displayed using the
<b><&lt;img&gt;></b> tag.
</p>

<hr>

<h2>2. Hyperlink Example</h2>

<p>
Click the link below to visit Google.
</p>

<a href="https://www.google.com" target="_blank">
Open Google
</a>

<hr>

<h2>3. Iframe Example</h2>

<p>
The webpage below is displayed using an iframe.
</p>

<iframe
    src="https://www.wikipedia.org"
    width="1500"
    height="400"
    title="Wikipedia">
</iframe>

</div>

</body>
</html>
