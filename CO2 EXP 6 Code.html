<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic To-Do List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:450px;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#1f4e79;
    margin-bottom:20px;
}

.input-box{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    background:#1f4e79;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#16395c;
}

ul{
    list-style:none;
    margin-top:20px;
}

li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f5f5f5;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
}

.actions button{
    margin-left:5px;
}
</style>

</head>

<body>

<div class="container">

<h2>To-Do List</h2>

<div class="input-box">
<input type="text" id="task" placeholder="Enter Task">
<button id="addBtn">Add</button>
</div>

<ul id="taskList"></ul>

</div>

<script>

let tasks=[];
let editIndex=-1;

document.getElementById("addBtn").addEventListener("click",saveTask);

function saveTask(){

let text=document.getElementById("task").value.trim();

if(text==""){
alert("Enter a task");
return;
}

if(editIndex==-1){
tasks.push({name:text});
}
else{
tasks[editIndex].name=text;
editIndex=-1;
document.getElementById("addBtn").innerHTML="Add";
}

document.getElementById("task").value="";
displayTasks();

}

function displayTasks(){

let list=document.getElementById("taskList");
list.innerHTML="";

for(let i=0;i<tasks.length;i++){

list.innerHTML+=`
<li>
<span>${tasks[i].name}</span>

<div class="actions">
<button onclick="editTask(${i})">Edit</button>
<button onclick="deleteTask(${i})">Delete</button>
</div>

</li>`;
}

}

function editTask(index){

document.getElementById("task").value=tasks[index].name;
editIndex=index;
document.getElementById("addBtn").innerHTML="Update";

}

function deleteTask(index){

tasks.splice(index,1);
displayTasks();

}

</script>

</body>
</html>
