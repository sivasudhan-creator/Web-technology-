<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.calculator{
    width:360px;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 12px rgba(0,0,0,0.2);
}

input{
    width:100%;
    height:60px;
    font-size:24px;
    text-align:right;
    margin-bottom:15px;
    padding:10px;
    border:2px solid #1f4e79;
    border-radius:5px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:5px;
    background:#1f4e79;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#16395c;
}
</style>

</head>

<body>

<div class="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button onclick="clearDisplay()">C</button>
<button onclick="del()">⌫</button>
<button onclick="append('%')">%</button>
<button onclick="append('/')">/</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('*')">*</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('-')">-</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('+')">+</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="calculate()">=</button>
<button onclick="sqrt()">√</button>

<button onclick="square()">x²</button>
<button onclick="cube()">x³</button>
<button onclick="power()">xʸ</button>
<button onclick="pi()">π</button>

<button onclick="sin()">sin</button>
<button onclick="cos()">cos</button>
<button onclick="tan()">tan</button>
<button onclick="log()">log</button>

</div>

</div>

<script>

let display=document.getElementById("display");

function append(value){
    display.value+=value;
}

function clearDisplay(){
    display.value="";
}

function del(){
    display.value=display.value.slice(0,-1);
}

function calculate(){
    try{
        display.value=eval(display.value);
    }
    catch{
        display.value="Error";
    }
}

function sqrt(){
    display.value=Math.sqrt(eval(display.value));
}

function square(){
    display.value=Math.pow(eval(display.value),2);
}

function cube(){
    display.value=Math.pow(eval(display.value),3);
}

function power(){
    let p=prompt("Enter Power");
    display.value=Math.pow(eval(display.value),p);
}

function pi(){
    display.value+=Math.PI.toFixed(6);
}

function sin(){
    display.value=Math.sin(eval(display.value)*Math.PI/180).toFixed(6);
}

function cos(){
    display.value=Math.cos(eval(display.value)*Math.PI/180).toFixed(6);
}

function tan(){
    display.value=Math.tan(eval(display.value)*Math.PI/180).toFixed(6);
}

function log(){
    display.value=Math.log10(eval(display.value)).toFixed(6);
}

</script>

</body>
</html>
